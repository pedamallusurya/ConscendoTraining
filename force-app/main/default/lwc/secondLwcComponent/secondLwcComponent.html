<template>
    <lightning-button label="Click Me" variant="success" onclick={fetchAllSmbCustomers}></lightning-button>
    <lightning-button label="New" variant="destructive" onclick={newCustomers}></lightning-button>

    <lightning-datatable
        key-field="Id"
        data={accounts}
        columns={columnsList}
        draft-values={draftValues}
        onsave={handleSave}
        hide-checkbox-column>
    </lightning-datatable>
    <lightning-datatable
        key-field="Id"
        data={accounts}
        columns={columnsList}
        onrowaction={handleRowAction}>
    </lightning-datatable>
</template>
