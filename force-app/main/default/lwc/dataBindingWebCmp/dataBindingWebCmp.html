<template>
     <lightning-card title="My First LWC Component" icon-name="custom:custom14">
    <p> Fist Sample LWC Component</p>
    <h1> Employee Details </h1>
    <p> <b>Name : {empName}</b></p>
    <p><b> Age : {empAge}</b> </p>
    <b>Address :{Address}</b>
    <b>employees:{Employees}</b>
    <b>Dynamic Var : {dynamicVar}</b>
    </lightning-card>
    <lightning-button variant="brand" label="getAddress" title="titlename" onclick={getAddress}>
    </lightning-button>
    <lightning-input type="text" label="Show Template" value={dynamicVar} onchange={getLiveData}></lightning-input>
<template if:true={isShow}>
    This is Template two
 <template for:each={Employees} for:item="emp" for:index="index" >
        <p key={emp.index}>{emp}</p>
</template>
</template>
</template>
