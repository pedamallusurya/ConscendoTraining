<template>
    <lightning-card title="Account Form" icon-name="standard:account">
        <div class="slds-p-around_medium">
            <lightning-input  label="Account Name" name="Name" value={accountName} onchange={handleNameChange}  required></lightning-input>
            <lightning-input label="Account Number" name="AccountNumber" value={accountNumber} type="number" onchange={handleNumberChange}></lightning-input>
            <lightning-input-address label="Billing Address" name="BillingAddress" value={billingAddress} onchange={handleBillingChange}></lightning-input-address>
            <lightning-textarea label="Description" name="Description" value={description} onchange={handleDesChange}></lightning-textarea>
            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button variant="brand" label="Submit" onclick={handleSubmit}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
